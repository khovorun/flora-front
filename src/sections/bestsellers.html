<section id="Bestsellers" class="bestsellers-block">
  <div class="wrap">
    <h2 class="section-title">Top-Selling Bouquets</h2>
    <div class="swiper slides-swiper">
      <ul class="swiper-wrapper">
      </ul>

      <div class="slides-nav">
        <div class="swiper-pagination slides-dots"></div>
        <div class="slides-arrows">
          <button
            class="arrow-btn swiper-button-prev"
            id="slides-btn-prev"
            aria-label="Previous Bouquet"
            type="button"
          >
            <svg class="arrow-icon arrow-left">
              <use href="./public/symbol-defs.svg#icon-left-arrow-alt"></use>
            </svg>
          </button>
          <button
            class="arrow-btn swiper-button-next"
            id="slides-btn-next"
            aria-label="Next Bouquet"
            type="button"
          >
            <svg class="arrow-icon arrow-right">
              <use href="./public/symbol-defs.svg#icon-right-arrow-alt"></use>
            </svg>
          </button>
        </div>
      </div>
    </div>
  </div>
</section>
