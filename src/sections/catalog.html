<section id="Catalog" class="catalog-block">
  <div class="wrap">
    <h2 class="section-title">Bouquets</h2>
    <p class="catalog-subtitle">
      Explore our stunning selection of fresh flower bouquets.
    </p>
    <ul class="catalog-grid" id="catalog-list">
    </ul>
    <div id="catalog-empty" class="info-msg hidden-el">
      <p>No bouquets available.</p>
    </div>
    <div id="catalog-error" class="error-msg hidden-el">
      <p>Failed to load bouquets.</p>
    </div>
    <button class="btn gradient-btn" id="load-more-btn" aria-label="Show More Bouquets" type="button">Show More</button>
  </div>
</section>
