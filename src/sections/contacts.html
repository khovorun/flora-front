<section id="Contacts" class="contacts-block">
  <div class="wrap">
    <div class="contacts-info">
      <div class="contacts-header">
        <p class="contacts-tag">Connect</p>
        <h2 class="section-title">Get in Touch</h2>
        <p class="contacts-desc">
          We’re here to assist you with all your floral needs and inquiries.
        </p>
      </div>
      <ul class="contacts-list">
        <li class="contact-row">
          <svg class="contact-icon" width="24" height="24">
            <use href="./public/symbol-defs.svg#icon-phone"></use>
          </svg>
          <div class="contact-detail">
            <p class="contact-label">Phone</p>
            <a href="tel:+15551234567" class="contact-link" aria-label="Call +1 (555) 123-4567">+1 (555) 123-4567</a>
          </div>
        </li>
        <li class="contact-row">
          <svg class="contact-icon" width="24" height="24">
            <use href="./public/symbol-defs.svg#icon-map"></use>
          </svg>
          <div class="contact-detail">
            <p class="contact-label">Store</p>
            <a
              href="https://maps.google.com/?q=456+Floral+Ave,+Sydney+NSW+2000+AU"
              class="contact-link"
              target="_blank"
              aria-label="Find us on Google Maps"
              >456 Floral Ave, Sydney NSW 2000 AU</a
            >
          </div>
        </li>
      </ul>
    </div>
    <img
      src="./img/contacts-1x.webp"
      srcset="
        ./img/contacts-1x.webp 1x,
        ./img/contacts-2x.webp 2x
      "
      alt="Flowers"
      class="contacts-photo"
    />
  </div>
</section>
