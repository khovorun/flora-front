<section id="AboutUs" class="about-block">
  <div class="wrap">
    <div class="about-text">
      <span class="flower-icon-wrap">
        <svg class="flower-icon" width="96" height="85">
          <use href="./public/symbol-defs.svg#icon-Flower"></use>
        </svg>
      </span>
      <h2 class="section-title">Our Passion for Floral Artistry</h2>
      <p class="about-paragraph">
        At Flora, we believe that every bouquet tells a story. Our team
        meticulously crafts each arrangement, blending creativity with the
        freshest blooms to create stunning pieces for every occasion.
      </p>
    </div>
    <picture class="about-picture">
      <source
        media="(max-width: 1439px)"
        srcset="./img/hero-mobile-1x.webp 1x, ./img/hero-mobile-2x.webp 2x"
      />
      <img
        src="./img/hero-1x.webp"
        srcset="./img/hero-1x.webp 1x, ./img/hero-2x.webp 2x"
        alt="Girl with flowers"
        class="about-picture"
        fetchpriority="high"
      />
    </picture>
  </div>
</section>
