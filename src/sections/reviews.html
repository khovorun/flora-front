<section id="Reviews" class="reviews-block">
  <div class="wrap">
    <h2 class="section-title">What our clients says</h2>
    <div class="swiper feedback-swiper">
      <ul class="swiper-wrapper">
      </ul>
      <div class="feedback-nav">
        <button id="feedback-btn-prev" class="arrow-btn swiper-button-prev" aria-label="Previous review" type="button">
          <svg class="arrow-icon" width="48" height="48">
            <use href="./public/symbol-defs.svg#icon-left-arrow-alt"></use>
          </svg>
        </button>
        <button id="feedback-btn-next" class="arrow-btn swiper-button-next" aria-label="Next review" type="button">
          <svg class="arrow-icon" width="48" height="48">
            <use href="./public/symbol-defs.svg#icon-right-arrow-alt"></use>
          </svg>
        </button>
      </div>
    </div>
  </div>
</section>
